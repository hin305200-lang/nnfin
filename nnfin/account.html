<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ihr Konto — NN-Finanzberatung</title>
<meta name="description" content="Ihr Mandantenkonto bei der NN-Finanzberatung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bf5"/><stop offset="1" stop-color="#22b8d4"/>
    </linearGradient>
  </defs>
</svg>

<nav class="nav" aria-label="Hauptnavigation">
  <a class="nav-logo" href="index.html" aria-label="NN-Finanzberatung Startseite">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="12" height="12" rx="4" fill="url(#lgm)"/><rect x="10" y="10" width="12" height="12" rx="4" fill="url(#lgm)" opacity=".55"/></svg>
    NN Finanz
  </a>
  <div class="nav-links">
    <a href="index.html#why">Leistungen</a>
    <a href="index.html#keytools">Beratung</a>
  </div>
  <a class="nav-login" href="login.html" data-auth="login">Anmelden</a>
  <a class="nav-login" href="app.html" data-auth="account" hidden>Konto</a>
  <a class="nav-cta" href="signup.html" data-auth="signup">Registrieren</a>
  <button class="nav-cta" type="button" data-auth="logout" hidden>Abmelden</button>
</nav>

<main class="auth">
  <div class="auth-card" data-auth-account>
    <span class="badge"><span class="dot"></span>Angemeldet</span>
    <h1 data-account="greet">Willkommen</h1>
    <p class="lead">Ihr Mandantenkonto ist eingerichtet. Sie können sich jederzeit mit E-Mail und Passwort anmelden.</p>
    <div class="account-grid">
      <div class="account-row"><span>Name</span><b data-account="name"></b></div>
      <div class="account-row"><span>E-Mail</span><b data-account="email"></b></div>
      <div class="account-row"><span>Telefon</span><b data-account="phone"></b></div>
      <div class="account-row"><span>Mitglied seit</span><b data-account="since"></b></div>
    </div>
    <div class="account-actions">
      <a class="auth-submit" href="index.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Zur Startseite</a>
      <button class="btn-outline" type="button" data-auth="logout">Abmelden</button>
    </div>
  </div>
</main>
<script src="auth.js"></script>
</body>
</html>
