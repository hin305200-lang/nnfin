<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrieren — NN-Finanzberatung</title>
<meta name="description" content="Erstellen Sie Ihr Mandantenkonto bei der NN-Finanzberatung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bf5"/><stop offset="1" stop-color="#22b8d4"/>
    </linearGradient>
  </defs>
</svg>

<nav class="nav" aria-label="Hauptnavigation">
  <a class="nav-logo" href="index.html" aria-label="NN-Finanzberatung Startseite">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="12" height="12" rx="4" fill="url(#lgm)"/><rect x="10" y="10" width="12" height="12" rx="4" fill="url(#lgm)" opacity=".55"/></svg>
    NN Finanz
  </a>
  <div class="nav-links">
    <a href="index.html#why">Leistungen</a>
    <a href="index.html#keytools">Beratung</a>
  </div>
  <a class="nav-login" href="login.html" data-auth="login">Anmelden</a>
  <a class="nav-login" href="app.html" data-auth="account" hidden>Konto</a>
  <a class="nav-cta" href="signup.html" data-auth="signup">Registrieren</a>
  <button class="nav-cta" type="button" data-auth="logout" hidden>Abmelden</button>
</nav>

<main class="auth">
  <div class="auth-card">
    <span class="badge"><span class="dot"></span>Mandantenkonto</span>
    <h1>Registrieren</h1>
    <p class="lead">Ein Konto. Danach der Marktplatz: Tagesgeld, Festgeld und ETF-Portfolios bei Partnerbanken.</p>
    <form data-auth-form="signup" novalidate>
      <p class="auth-error" data-auth-error hidden></p>
      <div class="field">
        <label for="name">Vollständiger Name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="phone">Telefon <span style="color:var(--mut);font-weight:500">(optional)</span></label>
        <input id="phone" name="phone" type="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm">Passwort bestätigen</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="auth-submit" type="submit">Konto erstellen</button>
    </form>
    <p class="auth-switch">Bereits ein Konto? <a href="login.html">Anmelden</a></p>
  </div>
</main>
<script src="auth.js"></script>
</body>
</html>
