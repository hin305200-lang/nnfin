<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NN Finanz — Wealth Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bf5"/><stop offset="1" stop-color="#22b8d4"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <aside class="side">
    <a class="side-brand" href="index.html">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="12" height="12" rx="4" fill="url(#lgm)"/><rect x="10" y="10" width="12" height="12" rx="4" fill="url(#lgm)" opacity=".55"/></svg>
      NN Finanz
    </a>
    <p class="nav-label">Vermögen</p>
    <button class="nav-item on" data-view="overview">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/></svg>
      Übersicht
    </button>
    <button class="nav-item" data-view="accounts">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      Konten
    </button>
    <button class="nav-item" data-view="banks">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-8h6v8"/></svg>
      Banken
    </button>
    <button class="nav-item" data-view="activity">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Umsätze
    </button>
    <p class="nav-label">Marktplatz</p>
    <button class="nav-item" data-view="market">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 12.4a2 2 0 002 1.6h9.4a2 2 0 002-1.6L23 6H6"/></svg>
      Entdecken
    </button>
    <button class="nav-item" data-view="savings">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Tagesgeld
    </button>
    <button class="nav-item" data-view="cds">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      Festgeld
    </button>
    <button class="nav-item" data-view="etf">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 6-8 3 4"/><path d="M3 21h18"/></svg>
      ETF-Portfolios
    </button>
    <div class="side-foot">
      <button class="nav-item" data-view="account">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
        Profil &amp; Sicherheit
      </button>
      <p class="side-note">Open-Banking-Demo: verbundene Konten sind simuliert. Keine echte Bankanbindung, keine Anlageberatung.</p>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <h1 id="pageTitle">Übersicht</h1>
      <div class="grow">
        <button class="icon-btn" id="quickTransfer" type="button" title="Überweisen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M7 7h10v10"/></svg>
        </button>
        <div class="user-chip">
          <div class="avatar" id="userAvatar">NN</div>
          <div><b id="userName">—</b><i>Mandantenkonto</i></div>
        </div>
        <button class="logout" type="button" data-auth="logout">Abmelden</button>
      </div>
    </header>
    <nav class="mobile-nav" aria-label="Bereiche">
      <button class="nav-item on" data-view="overview">Übersicht</button>
      <button class="nav-item" data-view="accounts">Konten</button>
      <button class="nav-item" data-view="banks">Banken</button>
      <button class="nav-item" data-view="activity">Umsätze</button>
      <button class="nav-item" data-view="market">Marktplatz</button>
      <button class="nav-item" data-view="savings">Tagesgeld</button>
      <button class="nav-item" data-view="cds">Festgeld</button>
      <button class="nav-item" data-view="etf">ETF</button>
      <button class="nav-item" data-view="account">Profil</button>
    </nav>
    <div class="content" id="view"></div>
  </div>
</div>

<script src="auth.js"></script>
<script src="banks.js"></script>
<script src="app.js"></script>
</body>
</html>
